<script>

let messages = [];
let polling = null;


/* =========================================
   로그인
========================================= */

document.getElementById("login").onclick = () => {
  window.location.href = "/auth/login";
};

document.getElementById("loginTop").onclick = () => {
  window.location.href = "/auth/login";
};


/* =========================================
   로그인 상태 확인
========================================= */

async function checkLogin() {

  try {

    const response =
      await fetch("/api/auth/status", {
        credentials: "same-origin"
      });

    const data =
      await response.json();

    console.log("로그인 상태:", data);

    if (data.loggedIn) {

      document.getElementById("login").textContent =
        "치지직 연결됨";

      document.getElementById("login").disabled =
        true;

      document.getElementById("loginTop").textContent =
        "연결됨";

      document.getElementById("loginTop").disabled =
        true;

      document.getElementById("headerStatus").textContent =
        "채널 연결됨";

      const user =
        data.user || {};

      document.getElementById("channelName").textContent =
        user.channelName ||
        user.nickname ||
        "치지직 채널 연결됨";

      document.getElementById("channelInfo").textContent =
        "실시간 방송 채팅을 수집할 준비가 되었습니다.";

    }

  } catch (error) {

    console.error(
      "로그인 상태 확인 오류:",
      error
    );

  }

}


/* 페이지 로딩 후 로그인 확인 */

checkLogin();


/* =========================================
   사건 수사 시작
========================================= */

document.getElementById("heroStart").onclick = () => {

  document.getElementById("start").scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

};


/* =========================================
   채팅 수집 시작
========================================= */

document.getElementById("start").onclick =
async () => {

  try {

    const response =
      await fetch(
        "/api/live/start",
        {
          method: "POST",
          credentials: "same-origin"
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      alert(
        data.message ||
        "채팅 수집을 시작할 수 없습니다."
      );

      return;

    }

    document.getElementById("liveStatus").textContent =
      "방송 감시를 시작했습니다.";

    if (polling) {
      clearInterval(polling);
    }

    polling =
      setInterval(
        loadMessages,
        1000
      );

    loadMessages();

  } catch (error) {

    console.error(
      "채팅 수집 시작 오류:",
      error
    );

    alert(
      "서버에 연결할 수 없습니다."
    );

  }

};


/* =========================================
   채팅 수집 중지
========================================= */

document.getElementById("stop").onclick =
async () => {

  try {

    await fetch(
      "/api/live/stop",
      {
        method: "POST",
        credentials: "same-origin"
      }
    );

  } catch (error) {

    console.error(
      "채팅 수집 중지 오류:",
      error
    );

  }

  if (polling) {

    clearInterval(polling);
    polling = null;

  }

  document.getElementById("liveStatus").textContent =
    "채팅 수집을 중지했습니다.";

};


/* =========================================
   채팅 불러오기
========================================= */

async function loadMessages() {

  try {

    const response =
      await fetch(
        "/api/chat/messages",
        {
          credentials: "same-origin"
        }
      );

    const data =
      await response.json();

    if (!response.ok) {
      return;
    }

    messages =
      data.messages || [];

    document.getElementById("chatCount").textContent =
      `채팅 ${messages.length}개`;

    const chatlog =
      document.getElementById("chatlog");

    if (messages.length === 0) {

      chatlog.innerHTML =
        `
        <div style="color:#555;font-size:12px;">
          아직 수집된 채팅이 없습니다.
        </div>
        `;

      return;

    }

    chatlog.innerHTML =
      messages
        .slice(-100)
        .map(message => {

          const time =
            message.timestamp
              ? new Date(
                  Number(message.timestamp)
                ).toLocaleString(
                  "ko-KR",
                  {
                    month: "2-digit",
                    day: "2-digit",
                    hour: "2-digit",
                    minute: "2-digit"
                  }
                )
              : "";

          return `
            <div class="chat-row">

              <span
                style="
                  color:#555;
                  font-size:10px;
                  margin-right:8px;
                "
              >
                ${escapeHtml(time)}
              </span>

              <span class="chat-name">
                ${escapeHtml(
                  message.nickname
                )}
              </span>

              <span class="chat-content">
                ${escapeHtml(
                  message.content
                )}
              </span>

            </div>
          `;

        })
        .join("");

    chatlog.scrollTop =
      chatlog.scrollHeight;

  } catch (error) {

    console.error(
      "채팅 불러오기 오류:",
      error
    );

  }

}


/* =========================================
   저장된 채팅 내역
========================================= */

document.getElementById("history").onclick =
async () => {

  const button =
    document.getElementById("history");

  try {

    button.disabled = true;

    button.textContent =
      "채팅 내역을 불러오는 중...";

    const response =
      await fetch(
        "/api/chat/history",
        {
          credentials: "same-origin"
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.message ||
        "채팅 내역을 불러오지 못했습니다."
      );

    }

    messages =
      data.messages || [];

    document.getElementById("chatCount").textContent =
      `채팅 ${messages.length}개`;

    const chatlog =
      document.getElementById("chatlog");

    if (messages.length === 0) {

      chatlog.innerHTML =
        `
        <div style="color:#555;font-size:12px;">
          저장된 채팅이 없습니다.
        </div>
        `;

      return;

    }

    chatlog.innerHTML =
      messages
        .slice(-100)
        .map(message => {

          const time =
            message.timestamp
              ? new Date(
                  Number(message.timestamp)
                ).toLocaleString(
                  "ko-KR",
                  {
                    month: "2-digit",
                    day: "2-digit",
                    hour: "2-digit",
                    minute: "2-digit"
                  }
                )
              : "";

          return `
            <div class="chat-row">

              <span
                style="
                  color:#555;
                  font-size:10px;
                  margin-right:8px;
                "
              >
                ${escapeHtml(time)}
              </span>

              <span class="chat-name">
                ${escapeHtml(
                  message.nickname
                )}
              </span>

              <span class="chat-content">
                ${escapeHtml(
                  message.content
                )}
              </span>

            </div>
          `;

        })
        .join("");

    chatlog.scrollTop =
      chatlog.scrollHeight;

    document.getElementById("liveStatus").textContent =
      `저장된 채팅 ${messages.length}개를 불러왔습니다.`;

  } catch (error) {

    console.error(
      "채팅 내역 조회 오류:",
      error
    );

    alert(
      error.message ||
      "채팅 내역을 불러오지 못했습니다."
    );

  } finally {

    button.disabled = false;

    button.textContent =
      "저장된 채팅 내역 불러오기";

  }

};


/* =========================================
   사건 생성
========================================= */

document.getElementById("open").onclick =
async () => {

  const button =
    document.getElementById("open");

  button.disabled = true;

  button.textContent =
    "저장된 채팅을 불러오는 중...";

  try {

    const historyResponse =
      await fetch(
        "/api/chat/history",
        {
          credentials: "same-origin"
        }
      );

    const historyData =
      await historyResponse.json();

    if (!historyResponse.ok) {

      throw new Error(
        historyData.message ||
        "저장된 채팅을 불러오지 못했습니다."
      );

    }

    const savedMessages =
      historyData.messages || [];

    const mergedMessages = [
      ...savedMessages,
      ...messages
    ];

    const uniqueMessages = [];

    const seen =
      new Set();

    for (
      const message
      of mergedMessages
    ) {

      const id =
        message.id ||
        [
          message.timestamp,
          message.nickname,
          message.content
        ].join("|");

      if (seen.has(id)) {
        continue;
      }

      seen.add(id);

      uniqueMessages.push(
        message
      );

    }

    messages =
      uniqueMessages;

    if (messages.length < 3) {

      alert(
        "저장된 채팅이 최소 3개 이상 필요합니다."
      );

      return;

    }

    button.textContent =
      "사건을 분석하고 있습니다...";

    const response =
      await fetch(
        "/api/case",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          credentials:
            "same-origin",

          body:
            JSON.stringify({
              messages
            })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.message ||
        "사건 생성에 실패했습니다."
      );

    }

    renderCase(data);

    document
      .getElementById("home")
      .classList
      .add("hidden");

    document
      .getElementById("game")
      .classList
      .remove("hidden");

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  } catch (error) {

    console.error(
      "사건 생성 오류:",
      error
    );

    alert(
      error.message ||
      "사건을 생성하는 중 오류가 발생했습니다."
    );

  } finally {

    button.disabled = false;

    button.textContent =
      "채팅으로 사건 만들기";

  }

};


/* =========================================
   사건 표시
========================================= */

function renderCase(data) {

  const suspects =
    data.suspects || [];

  document.getElementById("count").textContent =
    `용의자 ${suspects.length}명`;

  document.getElementById("brief").textContent =
    data.brief ||
    "확보된 증거를 검토하고 범인을 찾아보세요.";

  document.getElementById("exhibits").innerHTML =
    (data.exhibits || [])
      .slice(0, 6)
      .map(
        (item, index) => `
          <div class="evidence">

            <div class="evidence-number">
              증거 ${String(index + 1).padStart(2, "0")}
            </div>

            <div class="evidence-text">
              ${escapeHtml(item.text)}
            </div>

          </div>
        `
      )
      .join("");

  document.getElementById("choices").innerHTML =
    suspects
      .map(
        name => `
          <button
            class="suspect"
            data-name="${escapeHtml(name)}"
          >
            ${escapeHtml(name)}
          </button>
        `
      )
      .join("");

  document
    .querySelectorAll(".suspect")
    .forEach(button => {

      button.onclick = () => {

        const selected =
          button.dataset.name;

        const correct =
          selected === data.suspect;

        document
          .querySelectorAll(".suspect")
          .forEach(item => {

            item.classList.remove(
              "correct",
              "wrong"
            );

          });

        const result =
          document.getElementById("result");

        result.classList.remove(
          "hidden"
        );

        if (correct) {

          button.classList.add(
            "correct"
          );

          result.className =
            "result result-success";

          result.innerHTML =
            `
              <strong>사건 해결!</strong>
              <br>
              정확하게 범인을 찾아냈습니다.
            `;

        } else {

          button.classList.add(
            "wrong"
          );

          result.className =
            "result result-fail";

          result.innerHTML =
            `
              <strong>잘못된 용의자입니다.</strong>
              <br>
              증거를 다시 살펴보세요.
              <br><br>
              정답은
              <strong>
                ${escapeHtml(data.suspect)}
              </strong>
              입니다.
            `;

        }

      };

    });

}


/* =========================================
   뒤로가기
========================================= */

document.getElementById("back").onclick =
() => {

  document
    .getElementById("game")
    .classList
    .add("hidden");

  document
    .getElementById("home")
    .classList
    .remove("hidden");

  document
    .getElementById("result")
    .classList
    .add("hidden");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

};


/* =========================================
   HTML 특수문자 처리
========================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      character => {

        const table = {

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"

        };

        return table[character];

      }
    );

}

</script>
